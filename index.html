<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voorraadkast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg: #16211c;
    --bg-panel: #1c2a22;
    --paper: #f2ecdd;
    --paper-dim: #e5ddc8;
    --mustard: #d9a63e;
    --sage: #8fa382;
    --berry: #b4483a;
    --text: #ece7d8;
    --text-dim: #93a191;
    --line: #2c3b31;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header h1{ font-size:1.6rem; color:var(--paper); letter-spacing:.2px; }
  header .sub{ color:var(--text-dim); font-size:.85rem; margin-top:2px; }

  nav.tabs{
    display:flex; gap:4px; margin-top:16px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    background:none; border:none; color:var(--text-dim);
    font-family:'IBM Plex Sans'; font-size:.9rem; font-weight:500;
    padding:10px 4px; margin-right:18px; cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{ color:var(--paper); border-bottom-color:var(--mustard); }

  main{ padding:16px 18px 8px; max-width:640px; margin:0 auto; }

  select, input{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 10px; font-family:'IBM Plex Sans'; font-size:.92rem;
    width:100%;
  }
  input[type="checkbox"]{
    width:18px; height:18px; flex:none; accent-color:var(--mustard); padding:0;
  }
  label{ font-size:.78rem; color:var(--text-dim); display:block; margin:10px 0 4px; }

  .winkel-filter{ margin-bottom:14px; }

  .card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:10px;
  }
  .item-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .item-name{ font-weight:500; font-size:.98rem; }
  .item-meta{ color:var(--text-dim); font-size:.78rem; margin-top:2px; }
  .qty{ font-family:'IBM Plex Mono'; font-size:1.15rem; text-align:right; min-width:52px; }
  .qty.low{ color:var(--berry); }
  .stock-bar{ height:4px; border-radius:2px; background:var(--line); margin-top:8px; overflow:hidden; }
  .stock-bar > div{ height:100%; background:var(--sage); }
  .stock-bar.low > div{ background:var(--berry); }
  .item-actions{ display:flex; gap:8px; margin-top:10px; }
  .item-actions button{
    flex:1; padding:7px; font-size:.78rem; border-radius:7px; border:1px solid var(--line);
    background:none; color:var(--text-dim); cursor:pointer;
  }
  .item-actions button:active{ background:var(--line); }

  .empty{ color:var(--text-dim); text-align:center; padding:40px 10px; font-size:.9rem; }

  .fab{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--mustard); color:#1a1305; border:none; border-radius:999px;
    padding:14px 26px; font-family:'IBM Plex Sans'; font-weight:600; font-size:.95rem;
    display:flex; align-items:center; gap:8px; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,11,.75);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal{
    background:var(--bg); border:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; max-width:480px; padding:20px 18px 26px; max-height:88vh; overflow-y:auto;
  }
  .modal h2{ font-size:1.2rem; color:var(--paper); margin-bottom:4px; }
  .modal-close{ float:right; background:none; border:none; color:var(--text-dim); font-size:1.3rem; cursor:pointer; }

  .mode-toggle{ display:flex; gap:8px; margin:14px 0; }
  .mode-toggle button{
    flex:1; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel); color:var(--text-dim); font-weight:500; cursor:pointer;
  }
  .mode-toggle button.active{ border-color:var(--mustard); color:var(--mustard); background:#2a2210; }

  #reader{ border-radius:10px; overflow:hidden; margin-top:12px; }

  .btn-primary{
    width:100%; margin-top:16px; padding:12px; border:none; border-radius:8px;
    background:var(--sage); color:#0f1a12; font-weight:600; font-size:.95rem; cursor:pointer;
  }
  .btn-secondary{
    width:100%; margin-top:8px; padding:11px; border:1px solid var(--line); border-radius:8px;
    background:none; color:var(--text-dim); font-size:.88rem; cursor:pointer;
  }
  .scan-result{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:12px; margin-top:12px;
  }
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--paper); color:#1a1305; padding:10px 18px; border-radius:999px;
    font-size:.85rem; font-weight:500; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .winkel-tag{
    display:inline-block; font-size:.72rem; color:var(--mustard); border:1px solid var(--mustard);
    border-radius:999px; padding:1px 8px; margin-top:6px;
  }
  ul.plain{ list-style:none; padding:0; margin:0; }
  .winkel-manage-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .winkel-manage-row button{
    background:none; border:none; color:var(--berry); font-size:.8rem; cursor:pointer;
  }
  .item-thumb{
    width:46px; height:46px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:var(--line); border:1px solid var(--line);
  }
  .item-row-main{ display:flex; gap:10px; align-items:flex-start; }
  .foto-preview{
    width:80px; height:80px; border-radius:10px; object-fit:cover; margin-top:8px;
    border:1px solid var(--line); display:block;
  }
  header{ position:sticky; top:0; background:var(--bg); z-index:10; }
  .about-btn{
    position:absolute; top:20px; right:18px;
    width:34px; height:34px; border-radius:999px;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    font-size:1rem; cursor:pointer;
  }
  .settings-btn{
    position:absolute; top:20px; right:60px;
    width:34px; height:34px; border-radius:999px;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    font-size:1rem; cursor:pointer;
  }
  .about-menu-btn{
    display:block; width:100%; text-align:left; margin:0 0 8px;
    padding:13px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel); color:var(--text); font-size:.92rem; cursor:pointer;
  }
  .about-text p{ font-size:.88rem; line-height:1.5; color:var(--text); margin:0 0 12px; }
  .about-text strong{ color:var(--paper); }
  .version-box{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-top:12px; font-size:.88rem;
  }
  #screensaverOverlay{
    position:fixed; inset:0; background:#000; z-index:500;
    display:flex; align-items:center; justify-content:center;
  }
  #screensaverText{
    position:absolute; color:#3a4a3f; font-family:'Fraunces', serif; font-size:1.4rem;
    text-align:center; user-select:none; transition:top 1.5s ease, left 1.5s ease;
  }
  #screensaverText .tijd{ display:block; font-family:'IBM Plex Mono'; font-size:2.2rem; margin-top:6px; }
</style>
</head>
<body>

<header>
  <button class="about-btn" onclick="openAboutModal()">ℹ️</button>
  <button class="settings-btn" onclick="openInstellingenModal()">⚙️</button>
  <h1>Voorraadkast</h1>
  <div class="sub">wat er in huis is, en waar het vandaan komt made by Tom Weuts -version 2.1.0-</div>
  <nav class="tabs" id="mainTabs">
    <button data-tab="voorraad" class="active">Voorraad</button>
    <button data-tab="lijst">Boodschappen</button>
    <button data-tab="winkels">Winkels</button>
    <button data-tab="dedicated" id="dedicatedTabBtn" style="display:none;">Scan</button>
  </nav>
</header>

<main>

  <div id="tab-voorraad">
    <button id="aanvulToggleBtn" class="btn-secondary" style="margin:0 0 10px; border-color:var(--sage); color:var(--sage);" onclick="toggleAanvulModus()">🔄 Aanvul-modus starten</button>
    <div class="winkel-filter" style="display:flex; gap:8px;">
      <select id="filterWinkel" style="flex:1"><option value="">Alle winkels</option></select>
      <button class="btn-secondary" style="width:auto; margin:0; padding:9px 16px;" onclick="openNieuwProductModal()">+ toevoegen</button>
    </div>
    <select id="filterCategorie" style="margin-bottom:14px;"><option value="">Alle categorieën</option></select>
    <div id="voorraadList"></div>
  </div>

  <div id="tab-lijst" style="display:none">
    <div class="winkel-filter" style="display:flex; gap:8px;">
      <select id="lijstWinkel" style="flex:1"><option value="">Alle winkels</option></select>
      <button class="btn-secondary" style="width:auto; margin:0; padding:9px 14px;" onclick="openHandmatigToevoegenModal()">+ toevoegen</button>
      <button class="btn-secondary" style="width:auto; margin:0; padding:9px 14px;" onclick="openGenereerLijstModal()">🧾 genereer</button>
    </div>
    <div id="lijstList"></div>
  </div>

  <div id="tab-winkels" style="display:none">
    <label>Nieuwe winkel</label>
    <div style="display:flex; gap:8px;">
      <input id="nieuweWinkelNaam" placeholder="bv. Aldi">
      <button class="btn-secondary" style="width:auto; margin:0; padding:9px 16px;" onclick="voegWinkelToe()">Toevoegen</button>
    </div>
    <ul class="plain" id="winkelsBeheerList" style="margin-top:18px;"></ul>
  </div>

  <div id="tab-dedicated" style="display:none" onclick="meldActiviteit()" oninput="meldActiviteit()">
    <div class="mode-toggle">
      <button id="dedModeVerbruik" class="active" onclick="zetDedicatedModus('verbruik')">Verbruik</button>
      <button id="dedModeAanvullen" onclick="zetDedicatedModus('aanvullen')">Aanvullen</button>
    </div>
    <div id="dedicatedWinkelLabel" class="item-meta" style="margin-bottom:10px;"></div>
    <div id="dedicatedReader"></div>
    <div id="dedicatedResultArea"></div>
  </div>

</main>

<button class="fab" onclick="openScanModal()">📷 Scannen</button>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<datalist id="categorieSuggesties">
  <option value="Voeding">
  <option value="Snacks">
  <option value="Dranken">
  <option value="Diepvries">
  <option value="Kuismiddelen">
  <option value="Verzorging">
  <option value="Huishouden">
  <option value="Overig">
</datalist>

<script>
// ====== CONFIGURATIE — vul hier je eigen Supabase-project in ======
const SUPABASE_URL = "https://msxrzbkdeajugofrqodn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IjmnfdHK8CyJ8i2-KQZ2HA_BDHRFWw5";
// ====================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const APP_VERSION = "2.1.0";

let winkels = [];
let items = [];
let prijzenMap = {}; // item_id -> { prijs, datum }
let html5QrCode = null;
let scanMode = "aanvullen"; // of "verbruiken"

// ---------- helpers ----------
function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=> el.remove(), 2200);
}
function winkelNaam(id){
  const w = winkels.find(w => w.id === id);
  return w ? w.naam : '—';
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// ---------- data laden ----------
async function laadWinkels(){
  const { data, error } = await sb.from('winkels').select('*').order('naam');
  if(error){ console.error(error); return; }
  winkels = data || [];
  const opts = w => `<option value="${w.id}">${w.naam}</option>`;
  document.getElementById('filterWinkel').innerHTML = '<option value="">Alle winkels</option>' + winkels.map(opts).join('');
  document.getElementById('lijstWinkel').innerHTML = '<option value="">Alle winkels</option>' + winkels.map(opts).join('');
  renderWinkelsBeheer();
}

async function laadItems(){
  const { data, error } = await sb.from('items').select('*').order('naam');
  if(error){ console.error(error); return; }
  items = data || [];
  await laadPrijzen();
  vulCategorieFilter();
  renderVoorraad();
}

function vulCategorieFilter(){
  const huidig = document.getElementById('filterCategorie').value;
  const categorieen = [...new Set(items.map(i => i.categorie).filter(Boolean))].sort();
  document.getElementById('filterCategorie').innerHTML =
    '<option value="">Alle categorieën</option>' +
    categorieen.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('filterCategorie').value = huidig;
}

async function laadPrijzen(){
  const { data, error } = await sb.from('prijzen').select('item_id, prijs, aangemaakt_op').order('aangemaakt_op', { ascending: false });
  if(error){ console.error(error); return; }
  prijzenMap = {};
  (data || []).forEach(p => {
    if(!prijzenMap[p.item_id]) prijzenMap[p.item_id] = p; // eerste = meest recente, want al gesorteerd
  });
}

async function laadLijst(){
  const filter = document.getElementById('lijstWinkel').value;
  let q = sb.from('boodschappenlijst').select('*, items(naam, foto_url), winkels(naam)').order('toegevoegd_op');
  if(filter) q = q.eq('winkel_id', filter);
  const { data, error } = await q;
  if(error){ console.error(error); return; }
  renderLijst(data || []);
}

// ---------- render: voorraad ----------
function renderVoorraad(){
  const filterWinkelId = document.getElementById('filterWinkel').value;
  const filterCategorie = document.getElementById('filterCategorie').value;
  const lijst = items
    .filter(i => !filterWinkelId || i.winkel_id === filterWinkelId)
    .filter(i => !filterCategorie || i.categorie === filterCategorie)
    .sort((a, b) => (a.categorie || 'zzz').localeCompare(b.categorie || 'zzz') || a.naam.localeCompare(b.naam));
  const el = document.getElementById('voorraadList');
  if(lijst.length === 0){ el.innerHTML = '<div class="empty">Niets gevonden binnen deze selectie.</div>'; return; }
  el.innerHTML = lijst.map(i => {
    const low = i.hoeveelheid <= i.min_voorraad;
    const pct = Math.min(100, i.min_voorraad > 0 ? (i.hoeveelheid / (i.min_voorraad * 2)) * 100 : 100);
    return `
    <div class="card">
      <div class="item-row">
        <div class="item-row-main">
          <img class="item-thumb" src="${i.foto_url || ''}" onerror="this.style.visibility='hidden'" alt="">
          <div>
            <div class="item-name">${i.naam}</div>
            <div class="item-meta">${i.barcode || 'geen barcode'}${prijzenMap[i.id] ? ' · €' + Number(prijzenMap[i.id].prijs).toFixed(2) : ''}</div>
            <span class="winkel-tag">${winkelNaam(i.winkel_id)}</span>
            ${i.categorie ? `<span class="winkel-tag" style="border-color:var(--sage); color:var(--sage); margin-left:6px;">${i.categorie}</span>` : ''}
          </div>
        </div>
        <div class="qty ${low ? 'low' : ''}">${i.hoeveelheid}</div>
      </div>
      <div class="stock-bar ${low ? 'low' : ''}"><div style="width:${pct}%"></div></div>
      <div class="item-actions">
        <button onclick="verbruikItem('${i.id}')">− verbruik 1</button>
        <button onclick="vulAanItem('${i.id}')">+ vul aan</button>
        <button onclick="markeerBijnaOp('${i.id}')">bijna op</button>
        <button onclick="openBewerkModal('${i.id}')">bewerken</button>
      </div>
    </div>`;
  }).join('');
}

// ---------- render: boodschappenlijst ----------
function renderLijst(rijen){
  const el = document.getElementById('lijstList');
  if(rijen.length === 0){ el.innerHTML = '<div class="empty">Niets op het lijstje.</div>'; return; }
  el.innerHTML = rijen.map(r => {
    const prijs = prijzenMap[r.item_id];
    return `
    <div class="card">
      <div class="item-row">
        <div class="item-row-main">
          <img class="item-thumb" src="${r.items?.foto_url || ''}" onerror="this.style.visibility='hidden'" alt="">
          <div>
            <div class="item-name">${r.items?.naam || '—'}</div>
            <div class="item-meta">${prijs ? '€' + Number(prijs.prijs).toFixed(2) : ''}</div>
            <span class="winkel-tag">${r.winkels?.naam || '—'}</span>
          </div>
        </div>
        <button onclick="haalVanLijst('${r.id}')" style="background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:7px;padding:8px 12px;cursor:pointer;">gekocht</button>
      </div>
    </div>`;
  }).join('');
}

// ---------- render: winkels beheer ----------
function renderWinkelsBeheer(){
  const el = document.getElementById('winkelsBeheerList');
  if(winkels.length === 0){ el.innerHTML = '<div class="empty">Nog geen winkels.</div>'; return; }
  el.innerHTML = winkels.map(w => `
    <li class="winkel-manage-row">
      <span>${w.naam}</span>
      <button onclick="verwijderWinkel('${w.id}')">verwijderen</button>
    </li>
  `).join('');
}

// ---------- acties: winkels ----------
async function voegWinkelToe(){
  const naam = document.getElementById('nieuweWinkelNaam').value.trim();
  if(!naam) return;
  const { error } = await sb.from('winkels').insert({ naam });
  if(error){ toast('Kon winkel niet toevoegen'); console.error(error); return; }
  document.getElementById('nieuweWinkelNaam').value = '';
  await laadWinkels();
  toast('Winkel toegevoegd');
}
async function verwijderWinkel(id){
  if(!confirm('Winkel verwijderen?')) return;
  const { error } = await sb.from('winkels').delete().eq('id', id);
  if(error){ toast('Kon niet verwijderen (mogelijk nog gekoppelde producten)'); return; }
  await laadWinkels();
}

// ---------- acties: items ----------
async function voegOfWerkPrijsBij(itemId, winkelId, prijs){
  if(prijs === null || prijs === '' || isNaN(prijs)) return;
  await sb.from('prijzen').insert({ item_id: itemId, winkel_id: winkelId, prijs: parseFloat(prijs) });
}

async function checkLageVoorraad(item){
  if(item.hoeveelheid <= item.min_voorraad && item.winkel_id){
    const { error } = await sb.from('boodschappenlijst').upsert(
      { item_id: item.id, winkel_id: item.winkel_id },
      { onConflict: 'item_id,winkel_id' }
    );
    if(error) console.error('Kon niet toevoegen aan boodschappenlijst', error);
  }
}

async function verbruikItem(id){
  const item = items.find(i => i.id === id);
  const nieuw = Math.max(0, item.hoeveelheid - 1);
  const { data, error } = await sb.from('items').update({ hoeveelheid: nieuw }).eq('id', id).select().single();
  if(error){ toast('Fout bij bijwerken'); return; }
  await checkLageVoorraad(data);
  await laadItems();
}

async function vulAanItem(id){
  const item = items.find(i => i.id === id);
  const aantal = prompt(`Met hoeveel wil je "${item.naam}" aanvullen?`, '1');
  if(aantal === null || isNaN(aantal)) return;
  const nieuw = item.hoeveelheid + parseFloat(aantal);
  const { error } = await sb.from('items').update({ hoeveelheid: nieuw }).eq('id', id);
  if(error){ toast('Fout bij bijwerken'); return; }
  if(item.winkel_id){
    const prijs = prompt(`Prijs bij "${winkelNaam(item.winkel_id)}"? (leeg = overslaan)`, '');
    await voegOfWerkPrijsBij(id, item.winkel_id, prijs);
  }
  await laadItems();
  toast('Voorraad aangevuld');
}

async function markeerBijnaOp(id){
  const item = items.find(i => i.id === id);
  if(!item.winkel_id){ toast('Dit product heeft geen winkel gekoppeld'); return; }
  const rest = prompt(`Resterende voorraad van "${item.naam}"?`, '0');
  if(rest === null || rest === '' || isNaN(rest)) return;
  const nieuweHoeveelheid = parseFloat(rest);

  const { error: updateError } = await sb.from('items').update({ hoeveelheid: nieuweHoeveelheid }).eq('id', id);
  if(updateError){ toast('Kon voorraad niet bijwerken'); console.error(updateError); return; }

  const { error: listError } = await sb.from('boodschappenlijst').upsert(
    { item_id: id, winkel_id: item.winkel_id },
    { onConflict: 'item_id,winkel_id' }
  );
  if(listError){ toast('Kon niet toevoegen aan lijstje'); console.error(listError); return; }

  toast(`Toegevoegd aan lijstje voor ${winkelNaam(item.winkel_id)}`);
  await laadItems();
  await laadLijst();
}

async function haalVanLijst(id){

  const div = document.getElementById('genWinkelLijst');

  div.style.pointerEvents = alle ? 'none' : 'auto';

async function bevestigGenereerLijst(){
  const alle = document.getElementById('genAlleWinkels').checked;
  let gekozenWinkels = [];
  if(!alle){
    gekozenWinkels = Array.from(document.querySelectorAll('.genWinkelCheck:checked')).map(c => c.value);
    if(gekozenWinkels.length === 0){ toast('Kies minstens één winkel'); return; }
  }
  const kandidaten = items.filter(i =>
    i.winkel_id &&
    i.hoeveelheid <= i.min_voorraad &&
    (alle || gekozenWinkels.includes(i.winkel_id))
  );
  if(kandidaten.length === 0){ toast('Niets op of bijna op binnen deze selectie'); closeModal(); return; }

  for(const i of kandidaten){
    const { error } = await sb.from('boodschappenlijst').upsert(
      { item_id: i.id, winkel_id: i.winkel_id },
      { onConflict: 'item_id,winkel_id' }
    );
    if(error) console.error('Kon niet toevoegen', i.naam, error);
  }
  closeModal();
  toast(`${kandidaten.length} product(en) toegevoegd`);
  await laadLijst();
}

async function verwijderProduct(id){
  const item = items.find(i => i.id === id);
  if(!confirm(`"${item.naam}" volledig verwijderen? Dit verwijdert ook de prijshistoriek en eventuele boodschappenlijst-vermelding.`)) return;
  const { error } = await sb.from('items').delete().eq('id', id);
  if(error){ toast('Kon niet verwijderen'); console.error(error); return; }
  closeModal();
  await laadItems();
  toast('Product verwijderd');
}

async function bewaarBewerking(id){
  const item = items.find(i => i.id === id);
  const naam = document.getElementById('bewerkNaam').value.trim();
  const barcode = document.getElementById('bewerkBarcode').value.trim() || null;
  const categorie = document.getElementById('bewerkCategorie').value.trim() || null;
  const min = parseFloat(document.getElementById('bewerkMin').value);
  const prijs = document.getElementById('bewerkPrijs').value;
  const fotoInput = document.getElementById('bewerkFoto');
  if(!naam){ toast('Vul een naam in'); return; }

  const updates = { naam, barcode, categorie, min_voorraad: isNaN(min) ? 1 : min };

  if(fotoInput.files && fotoInput.files[0]){
    const file = fotoInput.files[0];
    const pad = `${id}-${Date.now()}.${file.name.split('.').pop()}`;
    const { error: uploadError } = await sb.storage.from('productfotos').upload(pad, file, { upsert: true });
    if(uploadError){ toast('Foto uploaden mislukt'); console.error(uploadError); return; }
    const { data: urlData } = sb.storage.from('productfotos').getPublicUrl(pad);
    updates.foto_url = urlData.publicUrl;
  }

  const { error } = await sb.from('items').update(updates).eq('id', id);
  if(error){
    toast(error.code === '23505' ? 'Die barcode is al in gebruik bij een ander product' : 'Kon niet opslaan');
    console.error(error); return;
  }

  if(prijs !== '' && !isNaN(prijs) && item.winkel_id){
    const huidigePrijs = prijzenMap[id]?.prijs;
    if(parseFloat(prijs) !== parseFloat(huidigePrijs)){
      const { error: prijsError } = await sb.from('prijzen').insert({ item_id: id, winkel_id: item.winkel_id, prijs: parseFloat(prijs) });
      if(prijsError) console.error('Kon prijs niet opslaan', prijsError);
    }
  }

  closeModal();
  await laadItems();
  toast('Opgeslagen');
}

// ---------- barcode opzoeken bij Open Food Facts ----------
async function zoekProductInfo(barcode){
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
    const data = await res.json();
    if(data.status === 1){
      return {
        naam: data.product.product_name || data.product.product_name_nl || '',
        foto: data.product.image_front_url || data.product.image_url || ''
      };
    }
  }catch(e){ console.warn('Open Food Facts opzoeken mislukt', e); }
  return { naam: '', foto: '' };
}

function openScanModal(){
  const root = document.getElementById('modalRoot');
  const vooringesteld = aanvulModusActief;
  root.innerHTML = `

        <div class="mode-toggle">

        </div>
        <label>Winkel (voor deze scan-sessie)</label>
        <select id="scanWinkel">${winkels.map(w=>`<option value="${w.id}">${w.naam}</option>`).join('')}</select>

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(

  ).catch(err => {

function setScanMode(mode){
  scanMode = mode;
  document.getElementById('modeAanvullen').classList.toggle('active', mode === 'aanvullen');
  document.getElementById('modeVerbruiken').classList.toggle('active', mode === 'verbruiken');
}
function sluitScanModal(){
  if(html5QrCode){
    html5QrCode.stop().then(()=> html5QrCode.clear()).catch(()=>{});
    html5QrCode = null;
  }
  closeModal();
}

async function onScanSuccess(decodedText){
  if(html5QrCode){
    try{ await html5QrCode.pause(true); }catch(e){}
  }
  const winkelId = aanvulModusActief ? aanvulWinkelId : document.getElementById('scanWinkel').value;
  if(!winkelId){ toast('Kies eerst een winkel'); resumeScan(); return; }
  if(aanvulModusActief) resetAanvulTimer();

  const bestaand = items.find(i => i.barcode === decodedText);
  const resultArea = document.getElementById('scanResultArea');

  if(bestaand){
    if(scanMode === 'aanvullen'){
      const nieuweHoeveelheid = bestaand.hoeveelheid + 1;
      await sb.from('items').update({ hoeveelheid: nieuweHoeveelheid, winkel_id: winkelId }).eq('id', bestaand.id);
      resultArea.innerHTML = `
        <div class="scan-result">
          <div class="item-name">${bestaand.naam}</div>
          <div class="item-meta">nieuwe voorraad: ${nieuweHoeveelheid}</div>
          <label>Prijs bij ${winkelNaam(winkelId)}</label>
          <input id="scanPrijs" type="number" step="0.01" placeholder="bv. 2.49">
          <button class="btn-primary" onclick="bevestigPrijsEnGa('${bestaand.id}','${winkelId}')">Bevestigen</button>
        </div>`;
      await laadItems();
    } else {
      const nieuweHoeveelheid = Math.max(0, bestaand.hoeveelheid - 1);
      const { data } = await sb.from('items').update({ hoeveelheid: nieuweHoeveelheid }).eq('id', bestaand.id).select().single();
      await checkLageVoorraad(data);
      resultArea.innerHTML = `
        <div class="scan-result">
          <div class="item-name">${bestaand.naam}</div>
          <div class="item-meta">resterende voorraad: ${nieuweHoeveelheid}${nieuweHoeveelheid <= bestaand.min_voorraad ? ' — toegevoegd aan boodschappenlijst' : ''}</div>
          <button class="btn-secondary" onclick="resumeScan()">Volgende scan</button>
        </div>`;
      await laadItems();
    }
  } else {
    const info = await zoekProductInfo(decodedText);
    resultArea.innerHTML = `
      <div class="scan-result">
        <div class="item-meta">onbekende barcode: ${decodedText}</div>
        ${info.foto ? `<img class="foto-preview" src="${info.foto}">` : ''}
        <label>Productnaam</label>
        <input id="nieuwProductNaam" value="${info.naam}">
        <label>Categorie (optioneel)</label>
        <input id="nieuwProductCategorie" list="categorieSuggesties" placeholder="bv. Voeding, Kuismiddelen...">
        <label>Startvoorraad</label>
        <input id="nieuwProductHoeveelheid" type="number" value="1">
        <label>Minimum voorraad</label>
        <input id="nieuwProductMin" type="number" value="1">
        <label>Prijs bij ${winkelNaam(winkelId)}</label>
        <input id="nieuwProductPrijs" type="number" step="0.01" placeholder="bv. 2.49">
        <input type="hidden" id="nieuwProductFoto" value="${info.foto}">
        <button class="btn-primary" onclick="maakNieuwProduct('${decodedText}','${winkelId}')">Product toevoegen</button>
      </div>`;
  }
}

async function bevestigPrijsEnGa(itemId, winkelId){
  const prijs = document.getElementById('scanPrijs').value;
  await voegOfWerkPrijsBij(itemId, winkelId, prijs);

async function maakNieuwProduct(barcode, winkelId){
  const naam = document.getElementById('nieuwProductNaam').value.trim();

  const min = parseFloat(document.getElementById('nieuwProductMin').value) || 1;
  const prijs = document.getElementById('nieuwProductPrijs').value;

// ---------- barcode scannen naar een willekeurig invulveld ----------
function openBarcodeScanOverlay(targetInputId){
  const overlay = document.createElement('div');
  overlay.id = 'barcodeScanOverlay';
  overlay.className = 'modal-overlay';
  overlay.style.zIndex = '300';
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="sluitBarcodeScanOverlay()">×</button>
      <h2>Scan barcode</h2>
      <div id="miniReader"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  window._miniScanTarget = targetInputId;
  window._miniQr = new Html5Qrcode("miniReader");
  window._miniQr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 220 },
    (decodedText) => {
      const veld = document.getElementById(window._miniScanTarget);
      if(veld) veld.value = decodedText;
      sluitBarcodeScanOverlay();
    },
    () => {}
  ).catch(err => {
    document.getElementById('miniReader').innerHTML = `<div class="empty">Camera niet beschikbaar: ${err}</div>`;
  });
}

function sluitBarcodeScanOverlay(){
  if(window._miniQr){
    window._miniQr.stop().then(()=> window._miniQr.clear()).catch(()=>{});
    window._miniQr = null;
  }
  const el = document.getElementById('barcodeScanOverlay');
  if(el) el.remove();
}

  document.getElementById('modalRoot').innerHTML = aboutSkelet('Toekomstperspectief', `
    <div class="about-text">
      <p>Deze app is bewust in stappen opgebouwd. Wat er (nog) aan kan komen:</p>
      <p><strong>Home Assistant</strong> — de app laten triggeren door een fysieke/HA-barcodescanner, met een dashboard-kaart die voorraad toont en meldingen geeft bij lage voorraad.</p>
      <p><strong>Prijsvergelijking</strong> — per product zien of het bij een andere winkel goedkoper is, met een knop om het naar dat winkellijstje te verplaatsen.</p>
      <p><strong>Promoties</strong> — actieve kortingen per winkel bijhouden naast de gewone prijs.</p>
      <p><strong>Kassabon-verwerking</strong> — een kassaticket (foto of mail-PDF) automatisch laten uitlezen om prijzen bij te werken.</p>
      <p><strong>Geolocatie</strong> — via een Home Assistant-zone bij aankomst in een winkel automatisch de bijhorende boodschappenlijst tonen, met suggesties om producten naar een goedkopere winkel te verplaatsen.</p>
    </div>
    <button class="btn-secondary" onclick="renderAboutMenu()">← Terug</button>
  `);
}

async function toonUpdateCheck(){
  document.getElementById('modalRoot').innerHTML = aboutSkelet('Update controleren', `
    <div class="version-box">Bezig met controleren...</div>
    <button class="btn-secondary" onclick="renderAboutMenu()">← Terug</button>
  `);
  const { data, error } = await sb.from('app_info').select('*').eq('id', 1).single();
  const box = document.querySelector('.version-box');
  if(error || !data){
    box.innerHTML = `Kon niet controleren (nog geen <span class="mono">app_info</span>-tabel ingesteld).`;
    return;
  }
  if(data.laatste_versie === APP_VERSION){
    box.innerHTML = `Je gebruikt de laatste versie (${APP_VERSION}).`;
  } else {
    box.innerHTML = `
      <strong style="color:var(--mustard)">Update beschikbaar: ${data.laatste_versie}</strong> (jij hebt ${APP_VERSION})
      ${data.wijzigingen ? `<p style="margin-top:8px;">${data.wijzigingen}</p>` : ''}
      ${data.update_procedure ? `<p style="margin-top:8px; color:var(--text-dim);">${data.update_procedure}</p>` : ''}
    `;
  }
}

// ---------- instellingen (lokaal per toestel) ----------
function getInstellingen(){
  return {
    dedicated: localStorage.getItem('vk_dedicated') === 'true',
    timerMin: parseFloat(localStorage.getItem('vk_timer_min')) || 5,
    screensaver: localStorage.getItem('vk_screensaver') !== 'false',
    screensaverMin: parseFloat(localStorage.getItem('vk_screensaver_min')) || 2
  };
}

function openInstellingenModal(){
  const inst = getInstellingen();
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2>Instellingen (dit toestel)</h2>
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
          <input type="checkbox" id="instDedicated" ${inst.dedicated ? 'checked' : ''}> Dit is een dedicated toestel
        </label>
        <label>Timer (minuten) — tijd zonder scan voor de aanvul-modus terugvalt</label>
        <input id="instTimer" type="number" step="0.5" min="0.5" value="${inst.timerMin}">
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
          <input type="checkbox" id="instScreensaver" ${inst.screensaver ? 'checked' : ''}> Schermbeveiliging tegen inbranden (op het scanscherm)
        </label>
        <label>Inactiviteit (minuten) voor schermbeveiliging start</label>
        <input id="instScreensaverMin" type="number" step="0.5" min="0.5" value="${inst.screensaverMin}">
        <button class="btn-primary" onclick="bewaarInstellingen()">Opslaan</button>
      </div>
    </div>
  `;
}

function bewaarInstellingen(){
  const dedicated = document.getElementById('instDedicated').checked;
  const timerMin = parseFloat(document.getElementById('instTimer').value) || 5;
  const screensaver = document.getElementById('instScreensaver').checked;
  const screensaverMin = parseFloat(document.getElementById('instScreensaverMin').value) || 2;
  localStorage.setItem('vk_dedicated', dedicated ? 'true' : 'false');
  localStorage.setItem('vk_timer_min', timerMin);
  localStorage.setItem('vk_screensaver', screensaver ? 'true' : 'false');
  localStorage.setItem('vk_screensaver_min', screensaverMin);
  closeModal();
  toast('Instellingen opgeslagen (dit toestel)');
  toepasApparaatModus();
}

function toepasApparaatModus(){
  const inst = getInstellingen();
  document.getElementById('dedicatedTabBtn').style.display = inst.dedicated ? 'inline-block' : 'none';
  document.getElementById('aanvulToggleBtn').style.display = inst.dedicated ? 'none' : 'block';
  if(inst.dedicated){
    document.getElementById('dedicatedTabBtn').click();
  } else {
    stopDedicatedCamera();
  }
}

// ---------- winkel kiezen (herbruikbaar mini-modal) ----------
function openKiesWinkelModal(callback){
  const winkelOpties = winkels.map(w => `<option value="${w.id}">${w.naam}</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2>Kies winkel</h2>
        <select id="kiesWinkelSelect">${winkelOpties}</select>
        <button class="btn-primary" onclick="bevestigKiesWinkel()">Bevestigen</button>
      </div>
    </div>
  `;
  window._kiesWinkelCallback = callback;
}
function bevestigKiesWinkel(){
  const winkelId = document.getElementById('kiesWinkelSelect').value;
  closeModal();
  if(window._kiesWinkelCallback) window._kiesWinkelCallback(winkelId);
}

// ---------- aanvul-modus op een gewoon toestel ----------
let aanvulModusActief = false;
let aanvulWinkelId = null;
let aanvulTimerHandle = null;

function toggleAanvulModus(){
  if(aanvulModusActief){
    stopAanvulModus();
    toast('Aanvul-modus gestopt');
  } else {
    if(winkels.length === 0){ toast('Voeg eerst een winkel toe'); return; }
    openKiesWinkelModal((winkelId) => {
      aanvulModusActief = true;
      aanvulWinkelId = winkelId;
      resetAanvulTimer();
      updateAanvulKnop();
      toast(`Aanvul-modus actief bij ${winkelNaam(winkelId)}`);
    });
  }
}

function stopAanvulModus(){
  aanvulModusActief = false;
  aanvulWinkelId = null;
  if(aanvulTimerHandle) clearTimeout(aanvulTimerHandle);
  updateAanvulKnop();
}

function resetAanvulTimer(){
  if(aanvulTimerHandle) clearTimeout(aanvulTimerHandle);
  const inst = getInstellingen();
  aanvulTimerHandle = setTimeout(() => {
    stopAanvulModus();
    toast('Aanvul-modus automatisch afgesloten');
  }, inst.timerMin * 60000);
}

function updateAanvulKnop(){
  const btn = document.getElementById('aanvulToggleBtn');
  if(!btn) return;
  if(aanvulModusActief){
    btn.textContent = `✅ Aanvullen actief bij ${winkelNaam(aanvulWinkelId)} — tik om te stoppen`;
  } else {
    btn.textContent = '🔄 Aanvul-modus starten';
  }
}

// ---------- dedicated toestel: permanent scanscherm ----------
let dedicatedQr = null;
let dedicatedModus = 'verbruik'; // of 'aanvullen'
let dedicatedWinkelId = null;
let dedicatedTimerHandle = null;

function startDedicatedCamera(){
  meldActiviteit();
  if(dedicatedQr) return;
  dedicatedQr = new Html5Qrcode("dedicatedReader");
  dedicatedQr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 220 },
    onDedicatedScan,
    () => {}
  ).catch(err => {
    document.getElementById('dedicatedReader').innerHTML = `<div class="empty">Camera niet beschikbaar: ${err}</div>`;
  });
}

function stopDedicatedCamera(){
  if(dedicatedQr){
    dedicatedQr.stop().then(()=> dedicatedQr.clear()).catch(()=>{});
    dedicatedQr = null;
  }
  if(dedicatedTimerHandle) clearTimeout(dedicatedTimerHandle);
  if(screensaverTimer) clearTimeout(screensaverTimer);
  verbergScreensaver();
}

function zetDedicatedModus(modus){
  if(modus === 'aanvullen'){
    if(winkels.length === 0){ toast('Voeg eerst een winkel toe'); return; }
    openKiesWinkelModal((winkelId) => {
      dedicatedModus = 'aanvullen';
      dedicatedWinkelId = winkelId;
      resetDedicatedTimer();
      updateDedicatedModusUI();
    });
  } else {
    dedicatedModus = 'verbruik';
    dedicatedWinkelId = null;
    if(dedicatedTimerHandle) clearTimeout(dedicatedTimerHandle);
    updateDedicatedModusUI();
  }
}

function updateDedicatedModusUI(){
  document.getElementById('dedModeVerbruik').classList.toggle('active', dedicatedModus === 'verbruik');
  document.getElementById('dedModeAanvullen').classList.toggle('active', dedicatedModus === 'aanvullen');
  document.getElementById('dedicatedWinkelLabel').textContent =
    dedicatedModus === 'aanvullen' ? `Aanvullen bij ${winkelNaam(dedicatedWinkelId)}` : '';
}

function resetDedicatedTimer(){
  if(dedicatedTimerHandle) clearTimeout(dedicatedTimerHandle);
  const inst = getInstellingen();
  dedicatedTimerHandle = setTimeout(() => {
    dedicatedModus = 'verbruik';
    dedicatedWinkelId = null;
    updateDedicatedModusUI();
    toast('Terug naar verbruik-modus');
  }, inst.timerMin * 60000);
}

async function onDedicatedScan(decodedText){
  meldActiviteit();
  if(dedicatedQr){ try{ await dedicatedQr.pause(true); }catch(e){} }
  const bestaand = items.find(i => i.barcode === decodedText);
  const resultArea = document.getElementById('dedicatedResultArea');

  if(!bestaand){
    const info = await zoekProductInfo(decodedText);
    const winkelOpties = winkels.map(w => `<option value="${w.id}">${w.naam}</option>`).join('');
    resultArea.innerHTML = `
      <div class="scan-result">
        <div class="item-meta">onbekende barcode: ${decodedText}</div>
        ${info.foto ? `<img class="foto-preview" src="${info.foto}">` : ''}
        <label>Productnaam</label>
        <input id="dedNieuwNaam" value="${info.naam}">
        <label>Winkel</label>
        <select id="dedNieuwWinkel">${winkelOpties}</select>
        <label>Startvoorraad</label>
        <input id="dedNieuwHoeveelheid" type="number" value="1">
        <label>Minimum voorraad</label>
        <input id="dedNieuwMin" type="number" value="1">
        <input type="hidden" id="dedNieuwFoto" value="${info.foto}">
        <button class="btn-primary" onclick="dedicatedMaakNieuwProduct('${decodedText}')">Product toevoegen</button>
      </div>`;
    if(dedicatedWinkelId) document.getElementById('dedNieuwWinkel').value = dedicatedWinkelId;
    return;
  }

  if(dedicatedModus === 'aanvullen'){
    const nieuweHoeveelheid = bestaand.hoeveelheid + 1;
    await sb.from('items').update({ hoeveelheid: nieuweHoeveelheid, winkel_id: dedicatedWinkelId }).eq('id', bestaand.id);
    toast(`+1 ${bestaand.naam} (${nieuweHoeveelheid})`);
    resetDedicatedTimer();
    await laadItems();
    dedicatedResumeScan();
  } else {
    const voorstel = Math.max(0, bestaand.hoeveelheid - 1);
    const voorselecteerJa = bestaand.min_voorraad > 0 && voorstel <= bestaand.min_voorraad;
    resultArea.innerHTML = `
      <div class="scan-result">
        <img class="foto-preview" src="${bestaand.foto_url || ''}" onerror="this.style.display='none'">
        <div class="item-name">${bestaand.naam}</div>
        <label>Hoeveel zijn er nog?</label>
        <div style="display:flex; gap:8px;">
          <input id="dedResterend" type="number" value="${voorstel}" style="flex:1">
          <button type="button" class="btn-secondary" style="width:auto; margin:0; padding:9px 14px;" onclick="document.getElementById('dedResterend').value=0">= op</button>
        </div>
        <label>Op boodschappenlijst zetten?</label>
        <div class="mode-toggle">
          <button id="dedLijstJa" class="${voorselecteerJa ? 'active' : ''}" onclick="dedZetLijstKeuze(true)">Ja</button>
          <button id="dedLijstNee" class="${voorselecteerJa ? '' : 'active'}" onclick="dedZetLijstKeuze(false)">Nee</button>
        </div>
        <button class="btn-primary" onclick="bevestigDedicatedVerbruik('${bestaand.id}')">Bevestigen</button>
      </div>`;
    window._dedLijstKeuze = voorselecteerJa;
  }
}

function dedZetLijstKeuze(waarde){
  window._dedLijstKeuze = waarde;
  document.getElementById('dedLijstJa').classList.toggle('active', waarde);
  document.getElementById('dedLijstNee').classList.toggle('active', !waarde);
}

async function bevestigDedicatedVerbruik(itemId){
  const item = items.find(i => i.id === itemId);
  const nieuweHoeveelheid = parseFloat(document.getElementById('dedResterend').value) || 0;
  const { error } = await sb.from('items').update({ hoeveelheid: nieuweHoeveelheid }).eq('id', itemId);
  if(error){ toast('Kon niet opslaan'); console.error(error); dedicatedResumeScan(); return; }
  if(window._dedLijstKeuze && item.winkel_id){
    await sb.from('boodschappenlijst').upsert(
      { item_id: itemId, winkel_id: item.winkel_id },
      { onConflict: 'item_id,winkel_id' }
    );
  }
  await laadItems();
  dedicatedResumeScan();
}

async function dedicatedMaakNieuwProduct(barcode){
  const naam = document.getElementById('dedNieuwNaam').value.trim();
  if(!naam){ toast('Vul een naam in'); return; }
  const winkelId = document.getElementById('dedNieuwWinkel').value || null;
  const hoeveelheid = parseFloat(document.getElementById('dedNieuwHoeveelheid').value) || 0;
  const min = parseFloat(document.getElementById('dedNieuwMin').value) || 1;
  const foto_url = document.getElementById('dedNieuwFoto').value || null;
  const { error } = await sb.from('items').insert({
    barcode, naam, hoeveelheid, min_voorraad: min, winkel_id: winkelId, foto_url
  });
  if(error){ toast('Kon product niet aanmaken'); console.error(error); dedicatedResumeScan(); return; }
  toast('Product toegevoegd');
  await laadItems();
  dedicatedResumeScan();
}

function dedicatedResumeScan(){
  document.getElementById('dedicatedResultArea').innerHTML = '';
  if(dedicatedQr){ dedicatedQr.resume(); }
}

// ---------- schermbeveiliging tegen inbranden (dedicated toestel) ----------
let screensaverTimer = null;
let screensaverActief = false;
let screensaverMoveInterval = null;

function meldActiviteit(){
  if(screensaverActief) verbergScreensaver();
  const inst = getInstellingen();
  if(screensaverTimer) clearTimeout(screensaverTimer);
  if(inst.screensaver && inst.dedicated){
    screensaverTimer = setTimeout(toonScreensaver, inst.screensaverMin * 60000);
  }
}

function toonScreensaver(){
  if(document.getElementById('tab-dedicated').style.display === 'none') return;
  screensaverActief = true;
  if(dedicatedQr){ try{ dedicatedQr.pause(true); }catch(e){} }
  const overlay = document.createElement('div');
  overlay.id = 'screensaverOverlay';
  overlay.onclick = meldActiviteit;
  overlay.innerHTML = `<div id="screensaverText">Voorraadkast<span class="tijd" id="screensaverKlok"></span></div>`;
  document.body.appendChild(overlay);
  verplaatsScreensaver();
  updateScreensaverKlok();
  screensaverMoveInterval = setInterval(() => { verplaatsScreensaver(); updateScreensaverKlok(); }, 15000);
}

function verplaatsScreensaver(){
  const el = document.getElementById('screensaverText');
  if(!el) return;
  const maxTop = window.innerHeight - 100;
  const maxLeft = window.innerWidth - 160;
  el.style.top = Math.max(20, Math.random() * maxTop) + 'px';
  el.style.left = Math.max(20, Math.random() * maxLeft) + 'px';
}

function updateScreensaverKlok(){
  const klok = document.getElementById('screensaverKlok');
  if(klok) klok.textContent = new Date().toLocaleTimeString('nl-BE', { hour:'2-digit', minute:'2-digit' });
}

function verbergScreensaver(){
  screensaverActief = false;
  if(screensaverMoveInterval) clearInterval(screensaverMoveInterval);
  const overlay = document.getElementById('screensaverOverlay');
  if(overlay) overlay.remove();
  if(dedicatedQr){ try{ dedicatedQr.resume(); }catch(e){} }
}

// ---------- init ----------
(async function init(){
  await laadWinkels();
  await laadItems();
  toepasApparaatModus();
})();
</script>
</body>
</html>
